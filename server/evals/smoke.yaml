name: smoke_basic_qa

# Deterministic link-check (design §8.2): confirms STT/LLM/TTS/gateway wiring
# hasn't broken after an edit. Text mode, no judge — fast and non-flaky.
#
#   uv run bot.py -t eval
#   uv run pipecat eval run evals/smoke.yaml -v

turns:
  # bot.py's on_client_ready kicks off a greeting LLM call on connect. A turn
  # with no `user:` just waits for/absorbs that response so the real question
  # below doesn't race it — sending user text immediately risks an
  # interruption that corrupts context (two consecutive "user" messages, no
  # assistant turn between) before the greeting is recorded (reproduced
  # 20260801: flaky 60s timeout, root-caused via broadcast_interruption log).
  - expect:
      - event: response

  - user: "北京是哪个国家的首都？"
    expect:
      - event: response
        text_contains: "中国"
